<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title"><title id="title">Concat UGC creator collaboration invitation</title><rect width="1080" height="1080" fill="#E5DDD0"/><path d="M72 156H1008M72 1008H1008" stroke="#0F0E0C" stroke-width="2"/><rect x="80" y="69" width="50" height="50" fill="#0F0E0C"/><text x="105" y="100" text-anchor="middle" font-family="Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="600" letter-spacing="-2.4" fill="#FFFFFF">[→]</text><text x="140" y="103" font-family="Cascadia Code, SFMono-Regular, Consolas, monospace" font-weight="600" font-size="24" letter-spacing="1.44" fill="#0F0E0C">CONCAT</text><text x="89" y="246" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#2B5940">FOR STUDY CREATORS</text><text x="82" y="385" font-family="Georgia,serif" font-size="76" fill="#0F0E0C">Show us how</text><text x="82" y="476" font-family="Georgia,serif" font-style="italic" font-size="82" fill="#2B5940">you learn.</text><path d="M87 495q165 18 315-4" fill="none" stroke="#2B5940" stroke-width="4" stroke-linecap="round"/><circle cx="782" cy="376" r="142" fill="#F4ECE1" stroke="#0F0E0C" stroke-width="2"/><text x="782" y="349" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="32" fill="#0F0E0C">teach it</text><text x="782" y="394" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="32" fill="#0F0E0C">in your words</text><path d="M535 535c97 82 189 91 278 25" fill="none" stroke="#2B5940" stroke-width="3" stroke-dasharray="5 12"/><text x="89" y="655" font-family="Arial,sans-serif" font-size="24" fill="#35312C">We’re looking for thoughtful, student-centered</text><text x="89" y="694" font-family="Arial,sans-serif" font-size="24" fill="#35312C">study content and honest first impressions.</text><rect x="84" y="760" width="910" height="111" fill="#F4ECE1" stroke="#0F0E0C" stroke-width="2"/><text x="122" y="808" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#2B5940">INTERESTED IN A UGC COLLAB?</text><text x="122" y="845" font-family="Arial,sans-serif" font-size="21" fill="#0F0E0C">DM “CREATOR” with your profile + a recent example.</text><text x="89" y="927" font-family="Georgia,serif" font-style="italic" font-size="23" fill="#2B5940">We’ll share the brief and terms before you decide. ↗</text><text x="989" y="1050" text-anchor="end" font-family="Arial,sans-serif" font-size="15" letter-spacing="2" fill="#514B43">THINK FOR YOURSELF</text></svg>
