<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title"><title id="title">Concat for educators: give students room to show their thinking</title><rect width="1200" height="630" fill="#E5DDD0"/><rect x="64" y="52" width="54" height="54" fill="#0F0E0C"/><text x="91" y="85.42857142857143" text-anchor="middle" font-family="Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="-2.5714285714285716" fill="#FFFFFF">[→]</text><text x="129.57142857142858" y="86.71428571428572" font-family="Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="25.714285714285715" font-weight="600" letter-spacing="1.542857142857143" fill="#0F0E0C">CONCAT</text><text x="70" y="205" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#2B5940">FOR EDUCATORS</text><text x="68" y="306" font-family="Georgia,serif" font-size="57" fill="#0F0E0C">Make room for students</text><text x="68" y="376" font-family="Georgia,serif" font-style="italic" font-size="63" fill="#2B5940">to show their thinking.</text><text x="73" y="445" font-family="Arial,sans-serif" font-size="21" fill="#35312C">Teach-back practice and thoughtful questions help learners</text><text x="73" y="479" font-family="Arial,sans-serif" font-size="21" fill="#35312C">explain what they understand, in their own words.</text><rect x="72" y="523" width="244" height="53" fill="#0F0E0C"/><text x="194" y="557" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="14" fill="#F4ECE1">EXPLORE AN EDUCATOR PILOT  ↗</text><path d="M893 156c-68 25-78 93-50 139s93 56 137 22 42-100 4-139-59-39-91-22z" fill="#F4ECE1" stroke="#0F0E0C" stroke-width="2"/><text x="927" y="248" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="25" fill="#0F0E0C">Explain it</text><path d="M985 313q103 10 100 105" fill="none" stroke="#2B5940" stroke-width="4" stroke-dasharray="4 9"/><circle cx="1058" cy="422" r="72" fill="#F4ECE1" stroke="#0F0E0C" stroke-width="2"/><text x="1058" y="418" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="23" fill="#0F0E0C">Question</text><text x="1058" y="446" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="23" fill="#0F0E0C">the why</text><path d="M988 490q-21 37-68 37" fill="none" stroke="#2B5940" stroke-width="4" stroke-dasharray="4 9"/><circle cx="849" cy="523" r="62" fill="#F4ECE1" stroke="#0F0E0C" stroke-width="2"/><text x="849" y="531" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="22" fill="#0F0E0C">Apply</text><text x="1150" y="600" text-anchor="end" font-family="Arial,sans-serif" font-size="13" letter-spacing="2" fill="#514B43">A LEARNING LOOP THAT STARTS WITH WHAT THEY KNOW</text></svg>


