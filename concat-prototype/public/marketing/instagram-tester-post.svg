<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title"><title id="title">Concat is looking for student testers</title><rect width="1080" height="1080" fill="#F4ECE1"/><path d="M72 156H1008M72 1008H1008" stroke="#0F0E0C" stroke-width="2"/><rect x="80" y="69" width="50" height="50" fill="#0F0E0C"/><text x="105" y="100" text-anchor="middle" font-family="Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="600" letter-spacing="-2.4" fill="#FFFFFF">[→]</text><text x="140" y="103" font-family="Cascadia Code, SFMono-Regular, Consolas, monospace" font-weight="600" font-size="24" letter-spacing="1.44" fill="#0F0E0C">CONCAT</text><text x="89" y="246" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#2B5940">CALLING CURIOUS STUDENTS</text><text x="82" y="385" font-family="Georgia,serif" font-size="76" fill="#0F0E0C">Help shape a</text><text x="82" y="476" font-family="Georgia,serif" font-size="76" fill="#0F0E0C">more thoughtful</text><text x="82" y="567" font-family="Georgia,serif" font-style="italic" font-size="82" fill="#2B5940">way to study.</text><path d="M87 586q200 18 410-3" fill="none" stroke="#2B5940" stroke-width="4" stroke-linecap="round"/><rect x="84" y="665" width="910" height="194" fill="#E5DDD0" stroke="#0F0E0C" stroke-width="2"/><text x="122" y="719" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#2B5940">TRY AN EARLY CONCAT EXPERIENCE</text><text x="122" y="773" font-family="Arial,sans-serif" font-size="26" fill="#0F0E0C">Tell us what feels clear, confusing, or useful.</text><text x="122" y="817" font-family="Arial,sans-serif" font-size="20" fill="#514B43">Honest feedback welcome. No perfect answers required.</text><text x="89" y="927" font-family="Georgia,serif" font-style="italic" font-size="29" fill="#2B5940">Want the details? DM “TRY” ↗</text><text x="989" y="1050" text-anchor="end" font-family="Arial,sans-serif" font-size="15" letter-spacing="2" fill="#514B43">THINK FOR YOURSELF</text></svg>
