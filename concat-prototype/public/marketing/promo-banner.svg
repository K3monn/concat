<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title"><title id="title">Concat landscape promo: Knowing the answer is one thing</title><rect width="1200" height="630" fill="#F4ECE1"/><rect x="0" y="0" width="16" height="630" fill="#2B5940"/><rect x="65" y="57" width="54" height="54" fill="#0F0E0C"/><text x="92" y="90.42857142857143" text-anchor="middle" font-family="Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="-2.5714285714285716" fill="#FFFFFF">[→]</text><text x="130.57142857142858" y="91.71428571428572" font-family="Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="25.714285714285715" font-weight="600" letter-spacing="1.542857142857143" fill="#0F0E0C">CONCAT</text><text x="72" y="204" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#2B5940">A BETTER RELATIONSHIP WITH LEARNING</text><text x="70" y="314" font-family="Georgia,serif" font-size="64" fill="#0F0E0C">Knowing the answer</text><text x="70" y="392" font-family="Georgia,serif" font-size="64" fill="#0F0E0C">is one thing.</text><text x="70" y="475" font-family="Georgia,serif" font-style="italic" font-size="60" fill="#2B5940">Keep asking why.</text><text x="75" y="552" font-family="Arial,sans-serif" font-size="22" fill="#514B43">Explain what you know. Grow what you understand.</text><rect x="850" y="176" width="280" height="284" fill="#E5DDD0" stroke="#0F0E0C" stroke-width="2"/><text x="880" y="218" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#2B5940">A GOOD QUESTION</text><text x="880" y="285" font-family="Georgia,serif" font-size="26" fill="#0F0E0C">Why does that</text><text x="880" y="322" font-family="Georgia,serif" font-size="26" fill="#0F0E0C">step make sense?</text><path d="M886 362q35 28 85 0" fill="none" stroke="#2B5940" stroke-width="3"/><text x="880" y="420" font-family="Georgia,serif" font-style="italic" font-size="18" fill="#2B5940">Take a moment…</text><text x="1126" y="585" text-anchor="end" font-family="Arial,sans-serif" font-size="14" letter-spacing="2" fill="#514B43">THINK FOR YOURSELF · CONCAT.STUDY</text></svg>



