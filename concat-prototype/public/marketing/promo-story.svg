<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title"><title id="title">Concat story: familiar is not the same as understood</title><rect width="1080" height="1920" fill="#F4ECE1"/><rect x="64" y="69" width="64" height="64" fill="#0F0E0C"/><text x="96" y="108.61904761904762" text-anchor="middle" font-family="Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="21.333333333333332" font-weight="600" letter-spacing="-3.0476190476190474" fill="#FFFFFF">[→]</text><text x="141.71428571428572" y="110.14285714285714" font-family="Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="30.476190476190474" font-weight="600" letter-spacing="1.8285714285714283" fill="#0F0E0C">CONCAT</text><text x="88" y="310" font-family="Arial,sans-serif" font-weight="700" font-size="19" letter-spacing="4" fill="#2B5940">A SMALL STUDYING PARADOX</text><text x="82" y="500" font-family="Georgia,serif" font-size="83" fill="#0F0E0C">You read it.</text><text x="82" y="598" font-family="Georgia,serif" font-size="83" fill="#0F0E0C">You recognize it.</text><text x="82" y="696" font-family="Georgia,serif" font-style="italic" font-size="88" fill="#2B5940">But can you</text><text x="82" y="794" font-family="Georgia,serif" font-style="italic" font-size="88" fill="#2B5940">explain it?</text><path d="M88 817 Q293 836 500 812" fill="none" stroke="#2B5940" stroke-width="5"/><rect x="88" y="936" width="904" height="430" fill="#E5DDD0" stroke="#0F0E0C" stroke-width="2"/><text x="132" y="1000" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#2B5940">A MOMENT WITH CONCAT</text><circle cx="370" cy="1164" r="105" fill="#F4ECE1" stroke="#0F0E0C" stroke-width="2"/><circle cx="710" cy="1164" r="105" fill="#F4ECE1" stroke="#0F0E0C" stroke-width="2"/><text x="370" y="1156" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="25" fill="#0F0E0C">what I</text><text x="370" y="1190" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="25" fill="#0F0E0C">know</text><text x="710" y="1156" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="25" fill="#0F0E0C">what it</text><text x="710" y="1190" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="25" fill="#0F0E0C">connects to</text><path d="M490 1164h100m-18-17 18 17-18 17" fill="none" stroke="#2B5940" stroke-width="4"/><text x="132" y="1302" font-family="Arial,sans-serif" font-size="22" fill="#514B43">Teach it. Question it. Try it somewhere new.</text><text x="89" y="1512" font-family="Georgia,serif" font-size="51" fill="#0F0E0C">Think for</text><text x="89" y="1574" font-family="Georgia,serif" font-style="italic" font-size="63" fill="#2B5940">yourself.</text><rect x="88" y="1650" width="400" height="76" rx="3" fill="#0F0E0C"/><text x="288" y="1698" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="22" fill="#F4ECE1">START LEARNING  →</text><text x="89" y="1860" font-family="Arial,sans-serif" font-size="16" letter-spacing="3" fill="#514B43">NOT ANOTHER ANSWER. A BETTER UNDERSTANDING.</text></svg>

