<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title"><title id="title">Concat social post: Think for yourself</title><rect width="1080" height="1080" fill="#F4ECE1"/><path d="M72 156H1008M72 1008H1008" stroke="#0F0E0C" stroke-width="2"/><rect x="80" y="69" width="50" height="50" fill="#0F0E0C"/><text x="105" y="99.95238095238095" text-anchor="middle" font-family="Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="16.666666666666668" font-weight="600" letter-spacing="-2.380952380952381" fill="#FFFFFF">[→]</text><text x="140.71428571428572" y="101.14285714285714" font-family="Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="23.80952380952381" font-weight="600" letter-spacing="1.4285714285714286" fill="#0F0E0C">CONCAT</text><text x="978" y="102" text-anchor="end" font-family="Arial,sans-serif" font-size="17" letter-spacing="3" fill="#2B5940">A DIFFERENT WAY TO STUDY</text><text x="88" y="346" font-family="Georgia,serif" font-size="104" fill="#0F0E0C">Think for</text><text x="88" y="466" font-family="Georgia,serif" font-style="italic" font-size="116" fill="#2B5940">yourself.</text><path d="M92 487 Q285 510 478 484" fill="none" stroke="#2B5940" stroke-width="5" stroke-linecap="round"/><text x="94" y="568" font-family="Arial,sans-serif" font-size="29" fill="#514B43">Teach what you know. Find the why.</text><text x="94" y="612" font-family="Arial,sans-serif" font-size="29" fill="#514B43">Take your understanding somewhere new.</text><rect x="612" y="680" width="360" height="232" rx="4" fill="#E5DDD0" stroke="#0F0E0C" stroke-width="2"/><text x="648" y="729" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#2B5940">YOUR EXPLANATION</text><text x="648" y="790" font-family="Georgia,serif" font-style="italic" font-size="28" fill="#0F0E0C">“I think the two</text><text x="648" y="830" font-family="Georgia,serif" font-style="italic" font-size="28" fill="#0F0E0C">ideas connect because…”</text><text x="94" y="968" font-family="Georgia,serif" font-style="italic" font-size="25" fill="#2B5940">Understanding starts in your own words. ↗</text><text x="91" y="1050" font-family="Arial,sans-serif" font-size="15" letter-spacing="2" fill="#514B43">LEARNING THAT STAYS WITH YOU</text><text x="989" y="1050" text-anchor="end" font-family="Arial,sans-serif" font-size="15" letter-spacing="2" fill="#514B43">CONCAT.STUDY</text><path d="M533 688l10 23 24 3-18 15 5 24-21-12-21 12 5-24-18-15 24-3z" fill="#2B5940"/></svg>


